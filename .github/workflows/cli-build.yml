name: CLI Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 1.3.12+ fixes node:http response streams that stall before `end` (oven-sh/bun#28703), which
          # hung ~4% of large ClickHouse /api/query responses on 1.3.11. Skip 1.3.12 (broken macOS code
          # signature, oven-sh/bun#29270, fixed in 1.3.13) and 1.3.14 (runtime regressions, e.g.
          # oven-sh/bun#30634, #32178).
          bun-version: '1.3.13'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm cli:build

      - name: Smoke test
        run: ./cli/dist/evidence version
