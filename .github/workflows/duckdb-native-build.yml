name: DuckDB Native Binary

on:
  push:
    branches:
      - feat/duckdb-direct-connector
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-binary:
    name: DuckDB / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel

    env:
      EVIDENCE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify platform native bindings
        shell: bash
        run: |
          node -e "console.log(process.platform, process.arch)"
          node -e "require('@duckdb/node-api'); console.log('DUCKDB_PACKAGE_OK')"
        working-directory: cli

      - name: Build standalone CLI
        run: pnpm cli:build

      - name: Smoke test native DuckDB
        run: node cli/scripts/smoke-duckdb-binary.mjs
